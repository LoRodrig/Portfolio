<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Lorenzo Rodrigues | Portfólio de Dados</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:"Segoe UI", Arial, sans-serif;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      background:#07111f;
      color:#f5f7fa;
      line-height:1.6;
      overflow-x:hidden;
    }

    a{
      text-decoration:none;
      color:inherit;
    }

    .container{
      width:90%;
      max-width:1250px;
      margin:auto;
    }

    /* NAVBAR */

    nav{
      position:fixed;
      top:0;
      width:100%;
      z-index:1000;
      background:rgba(7,17,31,0.90);
      backdrop-filter:blur(14px);
      border-bottom:1px solid rgba(255,255,255,0.08);
    }

    .nav-content{
      width:90%;
      max-width:1250px;
      margin:auto;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:18px 0;
    }

    .logo{
      font-size:24px;
      font-weight:800;
      color:#38bdf8;
    }

    .nav-links{
      display:flex;
      gap:26px;
    }

    .nav-links a{
      color:#cbd5e1;
      transition:0.3s;
      font-size:14px;
      font-weight:600;
    }

    .nav-links a:hover{
      color:#38bdf8;
    }

    /* HERO */

    header{
      min-height:100vh;
      display:flex;
      align-items:center;
      position:relative;
      overflow:hidden;

      background:
        radial-gradient(circle at top right, rgba(0,174,255,0.20), transparent 35%),
        radial-gradient(circle at bottom left, rgba(0,255,179,0.12), transparent 35%),
        #07111f;
    }

    header::before{
      content:"";
      position:absolute;
      width:650px;
      height:650px;
      border-radius:50%;
      border:1px solid rgba(56,189,248,0.08);
      top:-280px;
      right:-280px;
    }

    .hero{
      position:relative;
      z-index:2;
      padding-top:100px;
    }

    .badge{
      display:inline-block;
      padding:10px 18px;
      border-radius:999px;
      background:rgba(56,189,248,0.12);
      border:1px solid rgba(56,189,248,0.3);
      color:#7dd3fc;
      margin-bottom:24px;
      font-size:14px;
      font-weight:700;
    }

    h1{
      font-size:clamp(48px, 8vw, 82px);
      line-height:1.05;
      max-width:950px;
      margin-bottom:24px;
    }

    .gradient-text{
      background:linear-gradient(90deg, #38bdf8, #22c55e);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .hero p{
      max-width:760px;
      color:#cbd5e1;
      font-size:20px;
      margin-bottom:36px;
    }

    .buttons{
      display:flex;
      flex-wrap:wrap;
      gap:16px;
    }

    .btn{
      padding:14px 24px;
      border-radius:12px;
      font-weight:700;
      transition:0.3s;
      display:inline-block;
    }

    .btn-primary{
      background:linear-gradient(135deg, #0284c7, #22c55e);
      color:white;
    }

    .btn-primary:hover{
      transform:translateY(-3px);
      box-shadow:0 12px 30px rgba(34,197,94,0.22);
    }

    .btn-secondary{
      border:1px solid rgba(255,255,255,0.16);
      background:rgba(255,255,255,0.03);
      color:#e2e8f0;
    }

    .btn-secondary:hover{
      background:rgba(255,255,255,0.08);
    }

    section{
      padding:95px 0;
    }

    .section-title{
      margin-bottom:50px;
    }

    .section-title span{
      color:#38bdf8;
      font-size:14px;
      letter-spacing:2px;
      font-weight:800;
      text-transform:uppercase;
    }

    .section-title h2{
      font-size:40px;
      margin-top:8px;
    }

    .card{
      background:rgba(15,23,42,0.88);
      border:1px solid rgba(148,163,184,0.16);
      border-radius:24px;
      padding:30px;
      box-shadow:0 20px 50px rgba(0,0,0,0.22);
    }

    .card p{
      color:#cbd5e1;
      margin-bottom:14px;
    }

    /* SOBRE */

    .about-grid{
      display:grid;
      grid-template-columns:1.2fr 0.8fr;
      gap:30px;
    }

    .skills{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      margin-top:24px;
    }

    .skill{
      padding:10px 14px;
      border-radius:999px;
      background:rgba(56,189,248,0.1);
      border:1px solid rgba(56,189,248,0.22);
      color:#bae6fd;
      font-size:14px;
      font-weight:600;
    }

    .stats{
      display:grid;
      gap:18px;
    }

    .stat{
      padding:22px;
      border-radius:18px;
      background:linear-gradient(
        135deg,
        rgba(56,189,248,0.12),
        rgba(34,197,94,0.08)
      );
      border:1px solid rgba(56,189,248,0.16);
    }

    .stat strong{
      display:block;
      font-size:32px;
      color:#7dd3fc;
      margin-bottom:8px;
    }

    .stat small{
      color:#cbd5e1;
      font-size:15px;
    }

    /* PROJETOS */

    .projects-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(330px, 1fr));
      gap:26px;
    }

    .project-card{
      min-height:480px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      transition:0.3s;
    }

    .project-card:hover{
      transform:translateY(-6px);
      border-color:rgba(56,189,248,0.35);
    }

    .featured{
      border:1px solid rgba(34,197,94,0.35);

      background:
        linear-gradient(
          135deg,
          rgba(34,197,94,0.08),
          rgba(56,189,248,0.06)
        ),
        rgba(15,23,42,0.84);
    }

    .tag{
      display:inline-block;
      padding:8px 14px;
      border-radius:999px;
      background:rgba(34,197,94,0.12);
      color:#86efac;
      border:1px solid rgba(34,197,94,0.28);
      font-size:13px;
      font-weight:700;
      margin-bottom:18px;
    }

    .project-icon{
      width:60px;
      height:60px;
      border-radius:18px;
      background:linear-gradient(135deg, #0284c7, #22c55e);
      display:flex;
      align-items:center;
      justify-content:center;
      color:white;
      font-weight:900;
      margin-bottom:22px;
      font-size:18px;
    }

    .project-card h3{
      font-size:24px;
      margin-bottom:14px;
    }

    .project-links{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:24px;
    }

    .project-links a{
      padding:11px 14px;
      border-radius:10px;
      background:rgba(255,255,255,0.07);
      border:1px solid rgba(255,255,255,0.12);
      color:#e2e8f0;
      font-size:13px;
      transition:0.3s;
      font-weight:600;
    }

    .project-links a:hover{
      background:rgba(56,189,248,0.15);
      color:#7dd3fc;
    }

    /* TIMELINE */

    .timeline{
      display:grid;
      gap:24px;
    }

    .timeline-item{
      border-left:3px solid #38bdf8;
      padding-left:22px;
    }

    .timeline-item h3{
      font-size:22px;
      margin-bottom:4px;
    }

    .timeline-item span{
      color:#7dd3fc;
      font-size:14px;
      font-weight:700;
    }

    .timeline-item p{
      margin-top:8px;
      color:#cbd5e1;
    }

    /* CONTATO */

    .contact{
      text-align:center;
      background:
        radial-gradient(circle at center,
        rgba(56,189,248,0.12),
        transparent 45%),
        #07111f;
    }

    .contact h2{
      font-size:42px;
      margin-bottom:18px;
    }

    .contact p{
      color:#cbd5e1;
      max-width:720px;
      margin:0 auto 34px;
      font-size:18px;
    }

    footer{
      padding:28px 0;
      text-align:center;
      color:#94a3b8;
      border-top:1px solid rgba(255,255,255,0.08);
      font-size:14px;
    }

    @media(max-width:950px){

      .about-grid{
        grid-template-columns:1fr;
      }

      .nav-links{
        display:none;
      }

      .projects-grid{
        grid-template-columns:1fr;
      }

      h1{
        font-size:52px;
      }

    }

  </style>

</head>

<body>

  <nav>

    <div class="nav-content">

      <div class="logo">
        Lorenzo Rodrigues
      </div>

      <div class="nav-links">
        <a href="#sobre">Sobre</a>
        <a href="#projetos">Projetos</a>
        <a href="#formacao">Experiência</a>
        <a href="#contato">Contato</a>
      </div>

    </div>

  </nav>

</body>

</html>
